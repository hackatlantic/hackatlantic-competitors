name: Isolated Wallet staging rehearsal
on:
  workflow_call:
    inputs:
      delivery_public_key:
        required: true
        type: string
permissions:
  contents: read
jobs:
  wallet:
    # Protected staging branch policy applies; never use Production credentials.
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VARS_JSON: ${{ secrets.TFVARS_STAGING_JSON }}
      TF_VAR_api_observability_env: ${{ secrets.API_OBSERVABILITY_ENV_JSON }}
      API_WALLET_ENV_JSON: ${{ secrets.API_WALLET_ENV_JSON }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WALLET_DELIVERY_PUBLIC_KEY: ${{ inputs.delivery_public_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: 1.14.3, terraform_wrapper: false}
      - name: Validate rehearsal safety contracts
        run: node --test tests/load/wallet-test-contract.test.mjs
      - name: Materialize protected staging configuration
        shell: bash
        run: |
          set +x
          umask 077
          test -n "$TF_VARS_JSON"
          printf '%s' "$TF_VARS_JSON" > infra/environments/staging/ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl.example
        working-directory: infra/environments/staging
      - name: Check isolated staging and preserve the current image
        run: node tests/load/wallet-staging.mjs preflight
      - name: Temporarily enable TEST Wallet class on staging only
        id: enable
        run: terraform apply -input=false -auto-approve -target=module.platform.digitalocean_app.api -var-file=../../../.tmp/wallet-enabled.tfvars.json
        working-directory: infra/environments/staging
      - name: Exercise authenticated Wallet and scanner lifecycle
        run: node tests/load/wallet-staging.mjs exercise
      - name: Remove this rehearsal's temporary staff access
        id: cleanup
        if: ${{ always() && hashFiles('.tmp/wallet-rehearsal-context.json') != '' }}
        run: node tests/load/wallet-staging.mjs cleanup
      - name: Restore disabled Wallet baseline and unchanged API image
        id: restore
        if: ${{ always() && steps.enable.outcome != 'skipped' && hashFiles('.tmp/wallet-disabled.tfvars.json') != '' }}
        run: terraform apply -input=false -auto-approve -target=module.platform.digitalocean_app.api -var-file=../../../.tmp/wallet-disabled.tfvars.json
        working-directory: infra/environments/staging
      - name: Verify disabled Wallet after restoration
        if: ${{ always() && steps.restore.outcome == 'success' && steps.cleanup.outcome == 'success' }}
        run: node tests/load/wallet-staging.mjs verify-restored
      - name: Upload encrypted device handoff and sanitized evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-device-${{ github.run_id }}
          path: |
            .tmp/wallet-device-delivery.encrypted.json
            .tmp/wallet-rehearsal-evidence.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary protected files
        if: always()
        run: rm -f infra/environments/staging/ci.auto.tfvars.json .tmp/wallet-enabled.tfvars.json .tmp/wallet-disabled.tfvars.json
