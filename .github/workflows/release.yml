name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hackatlantic/hackatlantic-api

jobs:
  image:
    name: Build immutable API image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        shell: bash
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:release-${{ github.run_number }}
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,mode=max,scope=release-api
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.70.0
      - name: Export standalone SPDX SBOM (best effort)
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: api-sbom.spdx.json
          artifact-name: api-sbom
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  frontend-stage:
    name: Build staged Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx --yes vercel@58.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@58.1.0 build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@58.1.0 deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy staging
    needs: [image, frontend-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    environment:
      name: staging
      url: ${{ needs.frontend-stage.outputs.deployment_url }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      GH_TOKEN: ${{ github.token }}
      TF_VARS_JSON: ${{ secrets.TFVARS_STAGING_JSON }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Authenticate to GHCR for provenance verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify build provenance
        run: gh attestation verify "oci://ghcr.io/${IMAGE_NAME}@${{ needs.image.outputs.digest }}" --repo "$GITHUB_REPOSITORY"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.14.3 }
      - name: Materialize protected Terraform inputs
        shell: bash
        working-directory: infra/environments/staging
        run: |
          test -n "${TF_VARS_JSON}"
          umask 077
          printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl.example
        working-directory: infra/environments/staging
      - run: terraform apply -input=false -auto-approve -var="api_image_digest=${{ needs.image.outputs.digest }}"
        working-directory: infra/environments/staging
      - name: Resolve staging API endpoint
        shell: bash
        working-directory: infra/environments/staging
        run: |
          # The provider exposes the stable .ondigitalocean.app endpoint as
          # default_ingress even when a custom domain is marked PRIMARY.
          api_url="$(terraform output -raw api_default_ingress)"
          if [[ -z "${api_url}" ]]; then
            echo "DigitalOcean did not return an app ingress URL" >&2
            exit 1
          fi
          [[ "${api_url}" == https://* ]]
          echo "STAGING_API_URL=${api_url}" >> "$GITHUB_ENV"
      - if: always()
        name: Remove protected Terraform inputs
        working-directory: infra/environments/staging
        run: rm -f ci.auto.tfvars.json
      - name: Verify staging deployment
        run: bash scripts/smoke-deployment.sh
        env:
          API_BASE_URL: ${{ env.STAGING_API_URL }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
      - uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1
        with:
          path: tests/load/smoke.js
        env:
          API_BASE_URL: ${{ env.STAGING_API_URL }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify authenticated staging journeys
        run: npm run test:e2e
        env:
          API_BASE_URL: ${{ env.STAGING_API_URL }}
          WEB_BASE_URL: ${{ needs.frontend-stage.outputs.deployment_url }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_APPLICANT_EMAIL: ${{ vars.E2E_APPLICANT_EMAIL }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
          E2E_SCANNER_EMAIL: ${{ vars.E2E_SCANNER_EMAIL }}
          E2E_FULL_LIFECYCLE: "true"
      - name: Materialize realistic scanner release-gate fixture inputs
        shell: bash
        run: |
          set +x
          database_password="$(jq -er '.supabase_database_password' <<<"${TF_VARS_JSON}")"
          echo "::add-mask::${database_password}"
          load_test_auth_secret="$(terraform -chdir=infra/environments/staging output -raw load_test_auth_secret)"
          test -n "${load_test_auth_secret}"
          echo "::add-mask::${load_test_auth_secret}"
          {
            echo "API_BASE_URL=${STAGING_API_URL}"
            echo "DATABASE_URL=postgresql://postgres.ovzrhurmiwqthfgycamx:${database_password}@aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require"
            echo "LOAD_TEST_AUTH_SECRET=${load_test_auth_secret}"
            echo "K6_FIXTURE_PATH=.tmp/k6-staging-fixture.json"
            echo "K6_SCANNER_FIXTURES=../../.tmp/k6-staging-fixture.json"
            echo "K6_SCANNER_PROFILE=release"
            echo "K6_SCANNER_IDENTITIES=20"
            echo "K6_SCANNER_PASS_COUNT=1500"
            echo "K6_SCANNER_VUS=20"
            echo "K6_SCANNER_ITERATIONS=1500"
            echo "K6_APPLICANT_COUNT=0"
          } >> "$GITHUB_ENV"
      - name: Prepare realistic scanner release-gate fixture
        run: node tests/load/staging-fixture.mjs prepare
      - name: Refresh short-lived scanner authentication
        run: node tests/load/staging-fixture.mjs refresh-scanner
      - name: Export release-gate checkpoint
        shell: bash
        run: echo "CHECKPOINT_ID=$(jq -er '.scanner.checkpointId' "${K6_FIXTURE_PATH}")" >> "$GITHUB_ENV"
      - name: Enforce realistic scanner release gate
        run: k6 run --summary-export .tmp/scanner-release-summary.json tests/load/scanner.js
        env:
          API_BASE_URL: ${{ env.STAGING_API_URL }}
      - name: Verify scanner release-gate ledger correctness
        if: ${{ always() && hashFiles('.tmp/k6-staging-fixture.json') != '' }}
        run: node tests/load/staging-fixture.mjs verify-scanner
      - name: Remove temporary staging staff access
        if: ${{ always() && env.LOAD_TEST_AUTH_SECRET != '' }}
        run: node tests/load/staging-fixture.mjs cleanup

  production:
    name: Promote production
    needs: [image, frontend-stage, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://apply.hackatlantic.ca
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TF_VARS_JSON: ${{ secrets.TFVARS_PRODUCTION_JSON }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Start deployment timer
        shell: bash
        run: echo "DEPLOYMENT_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.14.3 }
      - name: Materialize protected Terraform inputs
        shell: bash
        working-directory: infra/environments/production
        run: |
          test -n "${TF_VARS_JSON}"
          umask 077
          printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
      - run: terraform init -input=false -backend-config=backend.hcl.example
        working-directory: infra/environments/production
      - id: current
        shell: bash
        working-directory: infra/environments/production
        run: |
          app_id="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" \
            "https://api.digitalocean.com/v2/apps?per_page=200" \
            | jq -er '[.apps[] | select(.spec.name == "hackatlantic-api")] | if length == 1 then .[0].id else error("expected exactly one production app") end')"
          echo "app_id=${app_id}" >> "$GITHUB_OUTPUT"
          if [[ -n "${app_id}" ]]; then
            deployment_id="$(curl --fail --silent -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" "https://api.digitalocean.com/v2/apps/${app_id}/deployments" | jq -r '.deployments[] | select(.phase == "ACTIVE") | .id' | head -n 1)"
            echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          fi
      - id: apply
        continue-on-error: true
        # Application releases must not reconcile unrelated production controls
        # such as database sizing or alert recipients. Full infrastructure
        # reconciliation remains a separately reviewed operator action.
        run: terraform apply -input=false -auto-approve -target=module.platform.digitalocean_app.api -var="api_image_digest=${{ needs.image.outputs.digest }}"
        working-directory: infra/environments/production
      - if: always()
        name: Remove protected Terraform inputs
        working-directory: infra/environments/production
        run: rm -f ci.auto.tfvars.json
      - if: steps.apply.outcome == 'failure' && steps.current.outputs.app_id != '' && steps.current.outputs.deployment_id != ''
        name: Roll back API after failed infrastructure apply
        run: |
          curl --fail-with-body -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" -d '{"deployment_id":"${{ steps.current.outputs.deployment_id }}"}' "https://api.digitalocean.com/v2/apps/${{ steps.current.outputs.app_id }}/rollback"
      - if: steps.apply.outcome == 'failure'
        run: exit 1
      - id: smoke
        name: Verify exact production deployment
        continue-on-error: true
        shell: bash
        run: |
          app_id="${{ steps.current.outputs.app_id }}"
          if [[ -z "${app_id}" ]]; then
            app_id="$(terraform -chdir=infra/environments/production output -raw api_app_id)"
          fi
          expected_digest="${{ needs.image.outputs.digest }}"
          for attempt in {1..30}; do
            app="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" \
              "https://api.digitalocean.com/v2/apps/${app_id}")"
            phase="$(jq -r '.app.active_deployment.phase // empty' <<<"${app}")"
            active_digest="$(jq -r '.app.active_deployment.spec.services[] | select(.name == "api") | .image.digest // empty' <<<"${app}")"
            if [[ "${phase}" == "ACTIVE" && "${active_digest}" == "${expected_digest}" ]]; then
              echo "Production is healthy on the exact staging-tested digest."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not activate the expected digest within five minutes." >&2
          exit 1
      - if: steps.smoke.outcome == 'failure' && steps.current.outputs.app_id != '' && steps.current.outputs.deployment_id != ''
        name: Roll back API
        run: |
          curl --fail-with-body -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${DIGITALOCEAN_ACCESS_TOKEN}" -d '{"deployment_id":"${{ steps.current.outputs.deployment_id }}"}' "https://api.digitalocean.com/v2/apps/${{ steps.current.outputs.app_id }}/rollback"
      - if: steps.smoke.outcome == 'failure'
        run: exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - name: Promote staged frontend without rebuilding
        run: npx --yes vercel@58.1.0 promote "${{ needs.frontend-stage.outputs.deployment_url }}" --yes --token="$VERCEL_TOKEN"
      - name: Release summary
        shell: bash
        run: |
          duration_seconds="$(( $(date +%s) - DEPLOYMENT_STARTED_AT ))"
          {
            echo "### Production release"
            echo "- Git SHA: \`${GITHUB_SHA}\`"
            echo "- API digest: \`${{ needs.image.outputs.digest }}\`"
            echo "- API version: \`sha-${GITHUB_SHA}\`"
            echo "- Frontend: ${{ needs.frontend-stage.outputs.deployment_url }}"
            echo "- Production promotion duration: ${duration_seconds}s"
            echo "- Outcome: succeeded"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify release failure
    if: ${{ always() && (needs.image.result == 'failure' || needs.frontend-stage.result == 'failure' || needs.staging.result == 'failure' || needs.production.result == 'failure') }}
    needs: [image, frontend-stage, staging, production]
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ADMIN_ALERT_EMAILS: ${{ vars.ADMIN_ALERT_EMAILS }}
      ALERT_MESSAGE: HackAtlantic release failed for ${{ github.sha }}. Review the release workflow immediately.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash scripts/notify-incident.sh
