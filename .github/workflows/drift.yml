name: Infrastructure Drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ matrix.github_environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: global
            directory: infra/global
            github_environment: staging
          - environment: staging
            directory: infra/environments/staging
            github_environment: staging
          - environment: production
            directory: infra/environments/production
            github_environment: production
          - environment: observability
            directory: infra/observability
            github_environment: staging
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.14.3 }
      - run: terraform init -input=false -backend-config=backend.hcl.example
        working-directory: ${{ matrix.directory }}
      - id: plan
        shell: bash
        working-directory: ${{ matrix.directory }}
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          [[ "$code" -ne 1 ]]
      - if: steps.plan.outputs.exit_code == '2'
        name: Open drift issue
        run: >-
          gh issue create
          --title "Infrastructure drift detected: ${{ matrix.environment }}"
          --body "The scheduled Terraform plan detected out-of-band changes. Review workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
      - if: steps.plan.outputs.exit_code == '2' && env.DISCORD_WEBHOOK_URL != ''
        name: Notify Discord
        run: >-
          curl --fail-with-body
          -H 'Content-Type: application/json'
          -d '{"content":"HackAtlantic infrastructure drift detected in ${{ matrix.environment }}. Review GitHub Actions."}'
          "$DISCORD_WEBHOOK_URL"
      - if: steps.plan.outputs.exit_code == '2'
        run: exit 1
