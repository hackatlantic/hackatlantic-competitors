name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Git SHA expected from /versionz
        required: true
        type: string

permissions:
  contents: read

jobs:
  journeys:
    name: Applicant, admin, pass, and scanner journeys
    runs-on: ubuntu-24.04
    environment:
      name: staging
    env:
      API_BASE_URL: ${{ vars.STAGING_API_URL }}
      WEB_BASE_URL: ${{ vars.STAGING_WEB_URL }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_APPLICANT_EMAIL: ${{ vars.E2E_APPLICANT_EMAIL }}
      E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
      E2E_SCANNER_EMAIL: ${{ vars.E2E_SCANNER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: staging-playwright-report
          path: |
            playwright-report
            test-results/playwright
          retention-days: 14
