name: Encrypted ATS Backup

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: backup
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
      SPACES_REGION: ${{ vars.SPACES_REGION }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.BACKUP_SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SPACES_SECRET_ACCESS_KEY }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ADMIN_ALERT_EMAILS: ${{ vars.ADMIN_ALERT_EMAILS }}
      GRAFANA_OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      GRAFANA_OTLP_AUTHORIZATION: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION }}
      POSTGRES_CLIENT_IMAGE: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Validate backup configuration
        shell: bash
        run: |
          missing=()
          for name in DATABASE_URL SPACES_ENDPOINT SPACES_REGION BACKUP_BUCKET SPACES_ACCESS_KEY_ID SPACES_SECRET_ACCESS_KEY AGE_RECIPIENT; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing backup configuration: ${missing[*]}"
            exit 1
          fi
          command -v aws >/dev/null
          command -v docker >/dev/null
          command -v age >/dev/null
          docker run --rm "$POSTGRES_CLIENT_IMAGE" pg_dump --version
      - id: backup
        continue-on-error: true
        run: bash scripts/backup-ats.sh
      - name: Publish backup freshness metric
        if: steps.backup.outcome == 'success'
        continue-on-error: true
        run: bash scripts/push-otlp-gauge.sh hackatlantic.backup.last_success_unixtime "$(date +%s)" s
      - if: steps.backup.outcome == 'failure'
        continue-on-error: true
        run: bash scripts/notify-incident.sh
        env:
          ALERT_MESSAGE: HackAtlantic nightly ATS backup failed. Review GitHub Actions immediately.
      - if: always() && steps.backup.outcome == 'failure'
        run: exit 1
