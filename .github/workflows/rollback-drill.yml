name: Staging Rollback Drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK STAGING to authorize the selected staging-only recovery drill
        required: true
        type: string
      mode:
        description: Healthy-release rollback or deliberate unhealthy candidate rejection
        required: true
        default: previous-release
        type: choice
        options: [previous-release, unhealthy-candidate]

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  drill:
    name: Roll back and restore staging
    if: inputs.confirmation == 'ROLLBACK STAGING' && inputs.mode != 'unhealthy-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging-api.hackatlantic.ca
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      APP_NAME: hackatlantic-api-staging
      API_BASE_URL: https://staging-api.hackatlantic.ca
    steps:
      - name: Validate configuration
        shell: bash
        run: test -n "${DIGITALOCEAN_TOKEN}"
      - name: Prove rollback and restore the original digest
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${DIGITALOCEAN_TOKEN}")
          app_id="$(curl --fail --silent --show-error "${auth[@]}" \
            'https://api.digitalocean.com/v2/apps?per_page=200' \
            | jq -er --arg name "$APP_NAME" '[.apps[] | select(.spec.name == $name)] | if length == 1 then .[0].id else error("expected exactly one staging app") end')"
          deployments="$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.digitalocean.com/v2/apps/${app_id}/deployments?per_page=200")"
          original_id="$(jq -er '.deployments[] | select(.phase == "ACTIVE") | .id' <<<"$deployments" | head -n 1)"
          previous_id="$(jq -er '.deployments[] | select(.phase == "SUPERSEDED") | .id' <<<"$deployments" | head -n 1)"
          original_digest="$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.digitalocean.com/v2/apps/${app_id}" \
            | jq -er '.app.active_deployment.spec.services[] | select(.name == "api") | .image.digest')"
          previous_digest="$(curl --fail --silent --show-error "${auth[@]}" \
            "https://api.digitalocean.com/v2/apps/${app_id}/deployments/${previous_id}" \
            | jq -er '.deployment.spec.services[] | select(.name == "api") | .image.digest')"
          [[ "$original_digest" != "$previous_digest" ]] || { echo "No distinct previous digest is available for a meaningful drill" >&2; exit 1; }

          restored=false
          restore_original() {
            if [[ "$restored" != true ]]; then
              curl --fail-with-body --silent --show-error -X POST \
                -H 'Content-Type: application/json' "${auth[@]}" \
                -d "{\"deployment_id\":\"${original_id}\"}" \
                "https://api.digitalocean.com/v2/apps/${app_id}/rollback" >/dev/null || true
            fi
          }
          trap restore_original EXIT

          wait_for_digest() {
            local expected="$1"
            for _ in {1..36}; do
              active="$(curl --fail --silent --show-error "${auth[@]}" \
                "https://api.digitalocean.com/v2/apps/${app_id}" \
                | jq -r '.app.active_deployment.spec.services[] | select(.name == "api") | .image.digest // empty')"
              [[ "$active" == "$expected" ]] && return 0
              sleep 10
            done
            return 1
          }

          started="$(date +%s)"
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' "${auth[@]}" \
            -d "{\"deployment_id\":\"${previous_id}\"}" \
            "https://api.digitalocean.com/v2/apps/${app_id}/rollback" >/dev/null
          wait_for_digest "$previous_digest"
          rollback_seconds="$(( $(date +%s) - started ))"

          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' "${auth[@]}" \
            -d "{\"deployment_id\":\"${original_id}\"}" \
            "https://api.digitalocean.com/v2/apps/${app_id}/rollback" >/dev/null
          wait_for_digest "$original_digest"
          curl --fail --silent --show-error "${API_BASE_URL}/readyz" | grep -q ready
          restored=true
          trap - EXIT

          {
            echo '### Staging rollback drill'
            echo "- Previous digest activated: yes"
            echo "- Original digest restored: yes"
            echo "- Readiness after restoration: passed"
            echo "- Rollback activation time: ${rollback_seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"

  unhealthy:
    name: Reject unhealthy staging candidate and restore configuration
    if: inputs.confirmation == 'ROLLBACK STAGING' && inputs.mode == 'unhealthy-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    outputs:
      candidate_healthy: ${{ steps.result.outputs.candidate_healthy }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      API_BASE_URL: https://hackatlantic-api-staging-5c4l8.ondigitalocean.app
      DRILL_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify fault scope and release dependency gate
        run: node --test tests/load/rollback-contract.test.mjs
      - name: Submit a candidate with one invalid readiness path
        run: node scripts/staging-fault-drill.mjs inject
      - name: Require health-check rejection
        run: node scripts/staging-fault-drill.mjs detect
      - name: Always restore original staging deployment
        if: always() && hashFiles('.tmp/staging-fault-private.json') != ''
        run: node scripts/staging-fault-drill.mjs restore
      - name: Record promotion eligibility
        id: result
        run: |
          jq -e '.healthCheckFailure == true and .originalDigestRestored == true and .readinessPassed == true and .deploymentUnpinned == true and .candidateHealthy == false and .recoverySeconds < 300' .tmp/staging-fault-report.json
          echo 'candidate_healthy=false' >> "$GITHUB_OUTPUT"
          {
            echo '### Unhealthy staging candidate drill'
            jq -r '"- Detection: \(.detectionSeconds)s\n- Recovery after rollback request: \(.recoverySeconds)s\n- Original digest/readiness restored: true\n- Candidate eligible for promotion: false"' .tmp/staging-fault-report.json
            echo '- This is a rejected-candidate/configuration recovery drill, not proof of recovery from a production outage.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only the sanitized recovery report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-fault-${{ github.run_id }}
          path: .tmp/staging-fault-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private app spec from the runner
        if: always()
        run: rm -f .tmp/staging-fault-private.json

  promotion-canary:
    name: Non-deploying promotion gate canary
    needs: unhealthy
    if: needs.unhealthy.outputs.candidate_healthy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Unhealthy candidate incorrectly passed the gate' >&2; exit 1

  verify-gate:
    name: Confirm unhealthy candidate cannot advance
    needs: [unhealthy, promotion-canary]
    if: always() && inputs.confirmation == 'ROLLBACK STAGING' && inputs.mode == 'unhealthy-candidate'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test '${{ needs.unhealthy.result }}' = success
          test '${{ needs.promotion-canary.result }}' = skipped
          echo 'Non-deploying promotion canary was skipped. No production environment or credentials were accessed.' >> "$GITHUB_STEP_SUMMARY"
