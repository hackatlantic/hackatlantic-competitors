name: Infrastructure Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "policy/**"
      - ".github/workflows/infra-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan (${{ matrix.environment }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: terraform-plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: global
            directory: infra/global
            tfvars_secret: TFVARS_GLOBAL_JSON
          - environment: staging
            directory: infra/environments/staging
            tfvars_secret: TFVARS_STAGING_JSON
          - environment: production
            directory: infra/environments/production
            tfvars_secret: TFVARS_PRODUCTION_JSON
          - environment: observability
            directory: infra/observability
            tfvars_secret: TFVARS_OBSERVABILITY_JSON
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VARS_JSON: ${{ secrets[matrix.tfvars_secret] }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: 1.14.3 }
      - name: Require configured HCP credentials
        run: test -n "$TF_TOKEN_app_terraform_io"
      - id: inputs
        name: Materialize protected Terraform inputs
        shell: bash
        working-directory: ${{ matrix.directory }}
        run: |
          if [[ -z "${TF_VARS_JSON}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.environment }} is not activated; configure ${{ matrix.tfvars_secret }} to enable its plan"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          umask 077
          printf '%s' "${TF_VARS_JSON}" > ci.auto.tfvars.json
      - if: steps.inputs.outputs.configured == 'true'
        run: terraform init -input=false -backend-config=backend.hcl.example
        working-directory: ${{ matrix.directory }}
      - if: steps.inputs.outputs.configured == 'true'
        run: terraform plan -input=false -out=tfplan
        working-directory: ${{ matrix.directory }}
      - if: steps.inputs.outputs.configured == 'true'
        run: terraform show -json tfplan > tfplan.json
        working-directory: ${{ matrix.directory }}
      - if: steps.inputs.outputs.configured == 'true'
        name: Enforce infrastructure policy
        run: docker run --rm -v "$PWD:/project" openpolicyagent/conftest:v0.62.0 test "/project/${{ matrix.directory }}/tfplan.json" --policy /project/policy
      - if: always()
        name: Remove protected Terraform inputs
        working-directory: ${{ matrix.directory }}
        run: rm -f ci.auto.tfvars.json
