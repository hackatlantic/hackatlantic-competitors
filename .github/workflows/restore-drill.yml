name: ATS Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "13 14 1 * *"

permissions:
  contents: read

jobs:
  restore:
    name: Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: disaster-recovery
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restore -d restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTORE_DATABASE_URL: postgresql://restore:restore@localhost:5432/restore?sslmode=disable
      SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
      SPACES_REGION: ${{ vars.SPACES_REGION }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.BACKUP_SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SPACES_SECRET_ACCESS_KEY }}
      AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ADMIN_ALERT_EMAILS: ${{ vars.ADMIN_ALERT_EMAILS }}
      GRAFANA_OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      GRAFANA_OTLP_AUTHORIZATION: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION }}
      POSTGRES_CLIENT_IMAGE: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Validate restore configuration
        shell: bash
        run: |
          missing=()
          for name in SPACES_ENDPOINT SPACES_REGION BACKUP_BUCKET SPACES_ACCESS_KEY_ID SPACES_SECRET_ACCESS_KEY AGE_IDENTITY; do
            [[ -n "${!name:-}" ]] || missing+=("${name}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing restore configuration: ${missing[*]}"
            exit 1
          fi
          command -v aws >/dev/null
          command -v docker >/dev/null
          command -v age >/dev/null
          docker run --rm "$POSTGRES_CLIENT_IMAGE" pg_restore --version
      - id: restore
        continue-on-error: true
        run: bash scripts/restore-drill.sh
      - if: always()
        run: echo "rto_seconds=${{ steps.restore.outputs.rto_seconds || 'see logs' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tested RTO metric
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: bash scripts/push-otlp-gauge.sh hackatlantic.restore_drill.duration "${{ steps.restore.outputs.rto_seconds }}" s
      - if: steps.restore.outcome == 'failure'
        continue-on-error: true
        run: bash scripts/notify-incident.sh
        env:
          ALERT_MESSAGE: HackAtlantic monthly ATS restore drill failed. Review GitHub Actions immediately.
      - if: always() && steps.restore.outcome == 'failure'
        run: exit 1
