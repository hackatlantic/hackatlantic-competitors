name: Staging ATS load profiles

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Realistic release gate or explicitly non-gating stress/correctness profile
        required: true
        default: scanner-release
        type: choice
        options:
          - scanner-release
          - scanner-spike
          - scanner-contention
          - applicant-sustained
          - applicant-deadline
          - applicant-stress

permissions:
  contents: read

concurrency:
  group: staging-load-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  load-test:
    name: ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    env:
      API_BASE_URL: https://hackatlantic-api-staging-5c4l8.ondigitalocean.app
      K6_FIXTURE_PATH: .tmp/k6-staging-fixture.json
      K6_APPLICANT_FIXTURES: ../../.tmp/k6-staging-fixture.json
      K6_SCANNER_FIXTURES: ../../.tmp/k6-staging-fixture.json
      TF_VARS_JSON: ${{ secrets.TFVARS_STAGING_JSON }}
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
        with:
          k6-version: 1.7.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
      - name: Configure the selected fixed profile
        shell: bash
        run: |
          case "${{ inputs.profile }}" in
            scanner-release)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_SCANNER_PROFILE=release
          K6_SCANNER_IDENTITIES=20
          K6_SCANNER_PASS_COUNT=1500
          K6_SCANNER_VUS=20
          K6_SCANNER_ITERATIONS=1500
          K6_APPLICANT_COUNT=0
          EOF
              ;;
            scanner-spike)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_SCANNER_PROFILE=spike
          K6_SCANNER_IDENTITIES=20
          K6_SCANNER_PASS_COUNT=100
          K6_SCANNER_VUS=100
          K6_SCANNER_RATE=5
          K6_SCANNER_DURATION=20s
          K6_APPLICANT_COUNT=0
          EOF
              ;;
            scanner-contention)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_SCANNER_PROFILE=contention
          K6_SCANNER_IDENTITIES=20
          K6_SCANNER_PASS_COUNT=1
          K6_SCANNER_VUS=100
          K6_SCANNER_ITERATIONS=100
          K6_APPLICANT_COUNT=0
          EOF
              ;;
            applicant-sustained)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_APPLICANT_PROFILE=sustained
          K6_APPLICANT_COUNT=50
          K6_APPLICANT_VUS=20
          K6_SCANNER_IDENTITIES=0
          K6_SCANNER_PASS_COUNT=0
          EOF
              ;;
            applicant-deadline)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_APPLICANT_PROFILE=deadline
          K6_APPLICANT_COUNT=25
          K6_APPLICANT_VUS=25
          K6_SCANNER_IDENTITIES=0
          K6_SCANNER_PASS_COUNT=0
          EOF
              ;;
            applicant-stress)
              cat >> "$GITHUB_ENV" <<'EOF'
          K6_APPLICANT_PROFILE=stress
          K6_APPLICANT_COUNT=100
          K6_APPLICANT_VUS=100
          K6_SCANNER_IDENTITIES=0
          K6_SCANNER_PASS_COUNT=0
          EOF
              ;;
          esac
      - name: Materialize protected staging connections
        shell: bash
        run: |
          set +x
          test -n "${TF_VARS_JSON}"
          database_password="$(jq -er '.supabase_database_password' <<<"${TF_VARS_JSON}")"
          echo "::add-mask::${database_password}"
          echo "DATABASE_URL=postgresql://postgres.ovzrhurmiwqthfgycamx:${database_password}@aws-0-ca-central-1.pooler.supabase.com:5432/postgres?sslmode=require" >> "${GITHUB_ENV}"
          mkdir -p .tmp
          printf '%s' "${TF_VARS_JSON}" > infra/environments/staging/ci.auto.tfvars.json
      - name: Load staging-only synthetic identity secret
        shell: bash
        run: |
          terraform -chdir=infra/environments/staging init -input=false -backend-config=backend.hcl.example
          load_test_auth_secret="$(terraform -chdir=infra/environments/staging output -raw load_test_auth_secret)"
          test -n "${load_test_auth_secret}"
          echo "::add-mask::${load_test_auth_secret}"
          echo "LOAD_TEST_AUTH_SECRET=${load_test_auth_secret}" >> "${GITHUB_ENV}"
      - name: Prepare staging-only synthetic fixture
        run: node tests/load/staging-fixture.mjs prepare
      - name: Refresh short-lived scanner authentication
        if: startsWith(inputs.profile, 'scanner-')
        run: node tests/load/staging-fixture.mjs refresh-scanner
      - name: Export scanner checkpoint to k6
        if: startsWith(inputs.profile, 'scanner-')
        shell: bash
        run: |
          set +x
          checkpoint_id="$(jq -er '.scanner.checkpointId' "${K6_FIXTURE_PATH}")"
          echo "CHECKPOINT_ID=${checkpoint_id}" >> "${GITHUB_ENV}"
      - name: Run scanner profile
        id: scanner_load
        if: startsWith(inputs.profile, 'scanner-')
        continue-on-error: true
        run: k6 run --summary-export .tmp/profile-summary.json tests/load/scanner.js
      - name: Run applicant profile
        id: applicant_load
        if: startsWith(inputs.profile, 'applicant-')
        continue-on-error: true
        run: k6 run --summary-export .tmp/profile-summary.json tests/load/applicant.js
      - name: Verify scanner ledger correctness
        if: always() && startsWith(inputs.profile, 'scanner-')
        run: node tests/load/staging-fixture.mjs verify-scanner
      - name: Publish concise results
        if: always()
        shell: bash
        run: |
          if [[ -f .tmp/profile-summary.json ]]; then
            {
              echo "### ${{ inputs.profile }}"
              jq -r '.metrics.http_reqs.count | "- Requests: \(.)"' .tmp/profile-summary.json
              jq -r '.metrics.http_req_failed.value * 100 | "- System HTTP failure rate: \(.)%"' .tmp/profile-summary.json
              jq -r '.metrics["http_req_duration{operation:lookup}"]["p(95)"]? // empty | "- Lookup p95: \(.) ms"' .tmp/profile-summary.json
              jq -r '.metrics["http_req_duration{operation:redemption}"]["p(95)"]? // empty | "- Redemption p95: \(.) ms"' .tmp/profile-summary.json
              jq -r '["scanner_http_401", "scanner_http_403", "scanner_http_409", "scanner_http_422", "scanner_http_429", "scanner_http_5xx", "scanner_http_other_failures"][] as $metric | (.metrics[$metric].count? // 0) | "- \($metric): \(.)"' .tmp/profile-summary.json
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Remove temporary staging staff access
        if: ${{ always() && env.LOAD_TEST_AUTH_SECRET != '' }}
        run: node tests/load/staging-fixture.mjs cleanup
      - name: Remove protected Terraform inputs
        if: always()
        run: rm -f infra/environments/staging/ci.auto.tfvars.json
      - name: Upload sanitized k6 summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.profile }}-${{ github.run_id }}
          path: .tmp/profile-summary.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce the selected profile
        if: always()
        shell: bash
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
        run: |
          if [[ "${SELECTED_PROFILE}" == scanner-* ]]; then
            test "${{ steps.scanner_load.outcome }}" = "success"
          else
            test "${{ steps.applicant_load.outcome }}" = "success"
          fi
