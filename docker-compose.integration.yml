name: hackatlantic-competitors-integration

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: hackatlantic
      POSTGRES_PASSWORD: hackatlantic
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackatlantic -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  api-integration:
    image: golang:1.26-alpine
    working_dir: /workspace/api
    volumes:
      - ./:/workspace:ro
    environment:
      TEST_DATABASE_URL: postgres://hackatlantic:hackatlantic@postgres-test:5432/postgres?sslmode=disable
    command: ["go", "test", "-tags=integration", "./..."]
    depends_on:
      postgres-test:
        condition: service_healthy
