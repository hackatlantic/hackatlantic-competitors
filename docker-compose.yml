name: hackatlantic-competitors

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackatlantic
      POSTGRES_USER: hackatlantic
      POSTGRES_PASSWORD: hackatlantic
    ports:
      - "5432:5432"
    volumes:
      - hackatlantic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackatlantic -d hackatlantic"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: ./api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: "postgres://hackatlantic:hackatlantic@postgres:5432/hackatlantic?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: "postgres://hackatlantic:hackatlantic@postgres:5432/hackatlantic?sslmode=disable"
      DATABASE_MAX_CONNS: "10"
      DATABASE_QUERY_TIMEOUT: "5s"
      DATABASE_TRANSACTION_TIMEOUT: "15s"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:-}"
      CLERK_ISSUER_URL: "${CLERK_ISSUER_URL:-}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:-}"
      CLERK_JWKS_URL: "${CLERK_JWKS_URL:-}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:3000}"
      QR_TOKEN_PEPPER: "${QR_TOKEN_PEPPER:-}"
      CLAIM_TOKEN_PEPPER: "${CLAIM_TOKEN_PEPPER:-}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      RESUME_STORAGE_DIRECTORY: "/data/resumes"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - hackatlantic-resumes:/data/resumes

volumes:
  hackatlantic-postgres:
  hackatlantic-resumes:
