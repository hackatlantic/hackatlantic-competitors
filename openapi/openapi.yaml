      type: object
      description: A newly issued pass. The claim bearer exists only in this response; its QR bearer is also recoverable only by the authenticated active attendee.
      additionalProperties: false
      required: [id, attendeeId, displayName, status, issuedAt, qrToken, claimToken]
      properties:
        id:
          type: string
          format: uuid
        attendeeId:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          enum: [active]
        issuedAt:
          type: string
          format: date-time
        qrToken:
          type: string
          description: Opaque QR bearer credential deterministically derived for this active pass. Never stored raw.
        claimToken:
          type: string
          description: Opaque public claim bearer credential. Never stored raw or returned by read routes.
        claimUrl:
          type: string
          format: uri
          description: Claim URL containing the claim credential; never persisted in outbox data.
