name: hackatlantic-ats-production

services:
  migrate:
    build:
      context: ./api
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}"
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-10}"
      DATABASE_QUERY_TIMEOUT: "${DATABASE_QUERY_TIMEOUT:-5s}"
      DATABASE_TRANSACTION_TIMEOUT: "${DATABASE_TRANSACTION_TIMEOUT:-15s}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}"
      CLERK_ISSUER_URL: "${CLERK_ISSUER_URL:?CLERK_ISSUER_URL is required}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}"
      CLERK_JWKS_URL: "${CLERK_JWKS_URL:?CLERK_JWKS_URL is required}"
      APP_BASE_URL: "${APP_BASE_URL:?APP_BASE_URL is required}"
      QR_TOKEN_PEPPER: "${QR_TOKEN_PEPPER:?QR_TOKEN_PEPPER is required}"
      CLAIM_TOKEN_PEPPER: "${CLAIM_TOKEN_PEPPER:?CLAIM_TOKEN_PEPPER is required}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      SPACES_ENDPOINT: "${SPACES_ENDPOINT:?SPACES_ENDPOINT is required}"
      SPACES_REGION: "${SPACES_REGION:?SPACES_REGION is required}"
      SPACES_BUCKET: "${SPACES_BUCKET:?SPACES_BUCKET is required}"
      SPACES_ACCESS_KEY_ID: "${SPACES_ACCESS_KEY_ID:?SPACES_ACCESS_KEY_ID is required}"
      SPACES_SECRET_ACCESS_KEY: "${SPACES_SECRET_ACCESS_KEY:?SPACES_SECRET_ACCESS_KEY is required}"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}"
    environment:
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
